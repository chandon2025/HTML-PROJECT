<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color page</title>
    <style>
        body{font-family: sans-serif;text-align: center;}
        h1{color: #333;}
        .box{
            width: 120px; height: 120px; display: inline-block; margin: 8px; color: white; line-height: 120px;}
            #red {background: #e63946;}
            #blue{background: blue;}
            #green{background: green;}
            #yello{background: yellow;}
    </style>
</head>
<body>
    <h1>My colors</h1>
    <div class="box" id="red">red</div>
    <div class="box" id="green">green</div>
    <div class="box" id="blue">Blue</div>
    <div class="box" id="yello">yello</div>
</body>
</html>
